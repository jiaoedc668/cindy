[package]
name = "cindy-windows-unlock"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "=0.58.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
windows = { version = "=0.58.0", features = ["implement", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_Marshal", "Win32_System_Com_StructuredStorage", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Services", "Win32_System_LibraryLoader"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
